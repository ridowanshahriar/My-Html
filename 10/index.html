<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <video
      src="video.mp4"
      width="105"
      controls
      loop
      poster="download.jpg"
    ></video>
    <audio src="funny.mp3" controls loop></audio>

    <svg width="100" height="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="green"
        stroke-width="4"
        fill="yellow"
      />
    </svg>
    <iframe
      src="https://www.codewithharry.com/tutorial/working-with-svg"
      width="450"
      height="200"
    ></iframe>
  </body>
</html>
