<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bangladesh Railway</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img height="200" src="Image.png" alt="Train image" />
    <br />
    <table>
      <caption>
        Train Information
      </caption>
      <thead>
        <tr>
          <th>Train name</th>
          <th>destination</th>
          <th>Departure</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Udayan Express</td>
          <td>Dhaka</td>
          <td>10:00 AM</td>
        </tr>

        <tr>
          <td colspan="2">Ridowan</td>
          <td rowspan="2">Chittagong</td>
        </tr>
        <tr>
          <td colspan="2">Ridowan</td>
        </tr>
         <tfoot>
        <tr>
          <td colspan="2">Footer information</td>
          <td rowspan="2">Footer information</td>
        </tr>
      </tfoot>
      </tbody>
    </table>

    <ul type="square">
      <li>Ridowan</li>
      <li>Forkan</li>
      <li>Nasif</li>
    </ul>
    <ol type="A">
      <li>Ridowan</li>
      <li>Forkan</li>
      <li>Nasif</li>
    </ol>


  </body>
</html>
